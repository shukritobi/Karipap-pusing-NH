name: Deploy Karipap Pusing NH website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "solution.html"
      - "dashboard.html"
      - "payment-status.html"
      - "assets/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare current website
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html solution.html dashboard.html payment-status.html dist/
          cp -R assets dist/assets
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/assets/logo.js
          test -f dist/assets/hero.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
